
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Notes | Nursing Student Resources</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 25px 15px;
        }

        .purchase-box {
            max-width: 450px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000018;
        }

        h2 {
            color: #0757c9;
            text-align: center;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #0757c9;
            text-align: center;
            margin: 20px 0;
        }
         .payment-details {
    margin: 20px 0;
    padding: 15px;
    background: #f2f6fc;
    border-radius: 8px;
}

.payment-details select {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #0757c9;
    border-radius: 5px;
    font-size: 16px;
    background: white;
}

#paymentNumber {
    margin-top: 15px;
    font-weight: bold;
    color: #0757c9;
}
        button {
            width: 100%;
            padding: 14px;
            background: #0757c9;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #888;
        }

        a {
            color: #0757c9;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="purchase-box">

    <h2>Physiology Study Notes</h2>
     <div class="payment-details">
    <h3>Choose Payment Method</h3>

    <label for="paymentMethod">Mobile Money Network:</label>

    <select id="paymentMethod">
        <option value="">Select network</option>
        <option value="mtn">MTN Mobile Money</option>
        <option value="airtel">Airtel Money</option>
    </select>

    <p id="paymentNumber" hidden></p>
     </div>
    <p>
        Get access to our Physiology study materials
        prepared for Nursing students.
    </p>

    <p class="price">UGX 5000</p>

    <p>
        Submit a purchase request below. Your request
        will remain pending until payment is verified.
    </p>
    <label style="display:block; margin:20px 0;">
    <input type="checkbox" id="paymentConfirmation">
    I have made the payment of UGX 5,000.
    </label>
    <button id="requestButton" onclick="requestPurchase()">
        Request Physiology Notes
    </button>

    <p id="message"></p>

    <p style="text-align:center;">
        <a href="notes.html">Back to Study Notes</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://suvvqzcvebhwnvuxribt.supabase.co";

            const SUPABASE_KEY = "sb_publishable_RApmn1W8BbEZO1U1GD0_2g_cthTwUPS";





    const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storageKey: "nursing-student-auth"
        }
    }
);

    async function requestPurchase() {

        const button = document.getElementById("requestButton");
        const message = document.getElementById("message");
         const paymentMethod = document.getElementById("paymentMethod");

if (!paymentMethod.value) {
    message.textContent = "Please select MTN or Airtel before continuing.";
    return;
}
        const paymentConfirmation =
    document.getElementById("paymentConfirmation");

if (!paymentConfirmation.checked) {
    message.textContent =
        "Please confirm that you have made the payment.";
    return;
}
        button.disabled = true;
        message.textContent = "Checking your account...";

        try {
            const { data: userData, error: userError } =
                await supabaseClient.auth.getUser();

const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

if (sessionError) {
    message.textContent =
        "Session check failed: " + sessionError.message;
    button.disabled = false;
    return;
}

if (!sessionData.session) {
    message.innerHTML =
        'No saved login session found. Please <a href="login.html">sign in</a> first.';
    button.disabled = false;
    return;
}

const user = sessionData.session.user;
            message.textContent = "Submitting your request...";

            const { error } = await supabaseClient
                .from("purchases")
                .insert({
                    user_id: user.id,
                    product_id: "physiology",
                    status: "pending"
                });

            if (error) {
                if (error.code === "23505") {
                    message.textContent =
                        "You already have a Physiology purchase request.";
                } else {
                    message.textContent =
                        "Request failed: " + error.message;
                }

                button.disabled = false;
                return;
            }

            message.textContent =
                "Your request has been received. It is awaiting payment verification.";

        } catch (error) {
            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;
        }
    }
</script>
 <script>
const paymentMethod = document.getElementById("paymentMethod");
const paymentNumber = document.getElementById("paymentNumber");

paymentMethod.addEventListener("change", function () {
    if (this.value === "mtn") {
        paymentNumber.textContent =
            "Send UGX 5,000 to MTN: 0784743468";
        paymentNumber.hidden = false;
    } 
    else if (this.value === "airtel") {
        paymentNumber.textContent =
            "Send UGX 5,000 to Airtel: 0703203102";
        paymentNumber.hidden = false;
    } 
    else {
        paymentNumber.hidden = true;
    }
});
 </script>
</body>
</html>
