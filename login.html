
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Nursing Student Resources</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 30px 15px;
        }

        .login-box {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000018;
        }

        h2 {
            text-align: center;
            color: #0757c9;
        }

        p {
            text-align: center;
            color: #555;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #0757c9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0645a0;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Student Account</h2>
    <p>Register or sign in to access your study notes.</p>

    <input type="email" id="email" placeholder="Email address">

    <input type="password" id="password"
           placeholder="Password">

    <button onclick="register()">Create Account</button>

    <button onclick="login()">Sign In</button> 

    <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://suvvqzcvebhwnvuxribt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RApmn1W8BbEZO1U1GD0_2g_cthTwUPS";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function register() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (!email || password.length < 8) {
            message.textContent =
                "Enter a valid email and a password of at least 8 characters.";
            return;
        }

      const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
}, {
    emailRedirectTo: "https://Clintonaijuka644-svg.github.io/nursing-student-resources/confirm.html"
});

        if (error) {
            message.textContent = error.message;
        } else {
            message.textContent =
                "Registration received. Check your email for confirmation.";
        }
    }

    async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
        } else {
            message.textContent =
                "Login successful! Your account is signed in.";
        }
    }
</script>

</body>
</html>
