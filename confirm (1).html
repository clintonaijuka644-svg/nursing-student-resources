
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation</title>
</head>
<body>
    <script>
const SUPABASE_URL = "https://suvvqzcvebhwnvuxribt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RApmn1W8BbEZO1U1GD0_2g_cthTwUPS";


const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function confirmEmail() {
    const message = document.getElementById("message");

    const code = new URLSearchParams(window.location.search).get("code");

if (!code) {
    message.textContent = "No confirmation code found. Please request a fresh email.";
    return;
}

const { error } = await supabaseClient.auth.exchangeCodeForSession(code);

    if (error) {
        message.textContent =
            "Confirmation failed. Please request a fresh confirmation email.";
        return;
    }

    message.textContent =
        "Email confirmed successfully! You can now sign in.";
}

confirmEmail();
</script>
</body>
</html>
